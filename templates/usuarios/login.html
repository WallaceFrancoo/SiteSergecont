
{% load static %}

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área Do Cliente</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static '/styles/styleLogin.css' %}">
</head>

<body>
    <div class="stars"></div>
    
    <div class="login-container">
        <div class="login-box">
            <div class="logo">
                <h1>SERGECONT</h1>
            </div>
            
            <form action="{% url 'login' %}" method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" class="form-control" name="email" id="email" 
                           placeholder="Digite seu e-mail" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" class="form-control" name="password" id="password" 
                           placeholder="Digite sua senha" required>
                </div>
                
                <button type="submit" class="btn-login">
                    Acessar Sistema
                </button>
            </form>
            
            <div class="back-link">
                <a href="{% url 'cadastro' %}">Não tem uma conta? Cadastre-se</a><br>



                <a href="{% url 'index' %}">← Voltar ao Início</a>
            </div>
        </div>
    </div>

    <script>
        // Gerar estrelas aleatórias
        function createStars() {
            const starsContainer = document.querySelector('.stars');
            const numberOfStars = 100;
            
            for (let i = 0; i < numberOfStars; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = Math.random() * 3 + 1 + 'px';
                star.style.height = star.style.width;
                star.style.animationDelay = Math.random() * 2 + 's';
                starsContainer.appendChild(star);
            }
        }
        
        createStars();
    </script>
</body>

</html>
