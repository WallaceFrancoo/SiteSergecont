{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem-vindo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{% static '/styles/styleInicio.css' %}">
</head>

<body>
    <div class="stars"></div>

    <div class="welcome-container">
        <div class="welcome-box">
            <h1 class="titulo">Bem-vindo à Área do Cliente</h1>
            <p class="subtitulo">Você já é nosso cliente?</p>

            <div class="opcoes-cliente">
                <form action="{% url 'Clientes' %}" method="get">
                    <button type="submit" class="btn-opcao btn-sim">Sim</button>
                </form>
                <form action="{% url 'FaleConosco' %}" method="get">
                    <button type="submit" class="btn-opcao btn-nao">Não</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Estrelas animadas
        function createStars() {
            const starsContainer = document.querySelector('.stars');
            const numberOfStars = 100;
            for (let i = 0; i < numberOfStars; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = Math.random() * 3 + 1 + 'px';
                star.style.height = star.style.width;
                star.style.animationDelay = Math.random() * 2 + 's';
                starsContainer.appendChild(star);
            }
        }
        createStars();
    </script>
</body>

</html>
